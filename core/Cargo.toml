[package]
name = "bluetooth_core"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
windows = { version = "0.56", optional = true }

[features]
default = ["btle"]
btle = []
classic = ["windows"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
